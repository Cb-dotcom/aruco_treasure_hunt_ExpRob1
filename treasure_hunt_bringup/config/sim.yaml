# Gazebo (erl1 assignment world)
/**:
  ros__parameters:
    use_sim_time: true

aruco_detector:
  ros__parameters:
    image_topic: /camera/image
    image_transport: raw
    detections_topic: /aruco/detections
    marker_image_topic: /marker_image
    dictionary: DICT_ARUCO_ORIGINAL

motion_controller:
  ros__parameters:
    cmd_vel_topic: /cmd_vel
    odom_topic: /odometry/filtered
    detections_topic: /aruco/detections
    control_rate_hz: 20.0
    max_linear_velocity: 0.3
    max_angular_velocity: 0.8
    detection_timeout_sec: 1.0          # ignore detections older than this
    search:                             # go ahead until a new marker is seen
      linear_velocity: 0.2
      timeout_sec: 60.0
      angular_velocity: 0.3             # turn to re-find a lost marker
    approach:                           # w = -k_omega (u - cx), v = k_v (sd - s)
      k_omega: 0.004
      k_v: 0.004
      target_side_px: 166.0             # sd: marker side when the robot must stop
      side_tolerance_px: 4.0
      center_tolerance_px: 10.0
      align_threshold_px: 60.0          # move forward only when roughly centred
      lost_timeout_sec: 5.0
    rotate:                             # omega = k_yaw * remaining angle
      k_yaw: 1.5
      tolerance_rad: 0.02
      min_angular_velocity: 0.1

hunt_manager:
  ros__parameters:
    startup_delay_sec: 3.0
    markers:
      ids: [1, 2, 3]                      # marker id -> rotation, + = left
      rotations_deg: [-90.0, 180.0, 90.0]
      final_id: 4                         # treasure: stop
